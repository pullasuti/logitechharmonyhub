# Cross-link mips-unknown-linux-musl on macOS with the bundled rust-lld + self-contained
# musl (see service/rustprobe / docs: rust-mips-toolchain memory). Build via service/build-mips.sh.
[target.mips-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes", "-C", "linker-flavor=ld.lld", "-C", "relocation-model=static", "-C", "link-arg=-no-pie", "-L", "native=/tmp/mipslibs"]
